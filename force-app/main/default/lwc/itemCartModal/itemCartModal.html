<template>
    <div class="slds-backdrop slds-backdrop_open" role="presentation">
        <section class="slds-modal slds-fade-in-open slds-modal_large" role="dialog" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title slds-hyphenate">Shopping Cart ({cartItemCount} items)</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={hasItems}>
                        <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                            <thead>
                                <tr class="slds-text-title_caps">
                                    <th scope="col">Item</th>
                                    <th scope="col">Unit Price</th>
                                    <th scope="col">Quantity</th>
                                    <th scope="col">Subtotal</th>
                                    <th scope="col"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={cart} for:item="cartItem">
                                    <tr key={cartItem.itemId}>
                                        <td>{cartItem.itemName}</td>
                                        <td>${cartItem.unitPrice}</td>
                                        <td>
                                            <lightning-input
                                                type="number"
                                                variant="label-hidden"
                                                min="1"
                                                max={cartItem.maxQty}
                                                value={cartItem.quantity}
                                                data-item-id={cartItem.itemId}
                                                onchange={handleQuantityChange}
                                                onblur={handleQuantityBlur}>
                                            </lightning-input>
                                        </td>
                                        <td>{cartItem.unitPrice * cartItem.quantity}</td>
                                        <td>
                                            <button class="slds-button slds-button_icon slds-button_icon-text-destructive" title="Remove" data-item-id={cartItem.itemId} onclick={handleRemove}>
                                                <lightning-icon icon-name="utility:delete" size="small"></lightning-icon>
                                                <span class="slds-assistive-text">Remove</span>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                        <div class="slds-text-align_right slds-m-top_medium slds-m-bottom_medium">
                            <p class="slds-text-heading_medium">
                                Grand Total: ${cartTotal}
                            </p>
                        </div>
                    </template>

                    <template if:false={hasItems}>
                        <div class="slds-text-align_center slds-m-around_medium">
                            <p class="slds-text-body_large">Your cart is empty.</p>
                        </div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleClose}>Cancel</button>
                    <lightning-button
                        variant="brand"
                        label="Checkout"
                        onclick={handleCheckout}
                        disabled={isCheckoutDisabled}>
                    </lightning-button>
                    <template if:true={isLoading}>
                        <lightning-spinner variant="brand" size="small"></lightning-spinner>
                    </template>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </div>
</template>
