<template>
    <template if:true={item}>
        <div class="slds-backdrop slds-backdrop_open" role="presentation">
            <section class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-modal__title slds-hyphenate">Item Details</h2>
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" variant="inverse" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-grid slds-gutters_medium">
                            <!-- Image -->
                            <div class="slds-col slds-size_1-of-3">
                                <template if:true={hasImage}>
                                    <img src={item.Image__c} alt={item.Name} class="detail-image" />
                                </template>
                                <template if:false={hasImage}>
                                    <div class="detail-image-placeholder">
                                        <lightning-icon icon-name="standard:product" size="large"></lightning-icon>
                                    </div>
                                </template>
                            </div>

                            <!-- Details -->
                            <div class="slds-col slds-size_2-of-3">
                                <lightning-record-view-form
                                    record-id={item.Id}
                                    object-api-name="Item__c">
                                    <div class="slds-grid slds-gutters_small">
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-output-field field-name="Name"></lightning-output-field>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-output-field field-name="Type__c"></lightning-output-field>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-output-field field-name="Family__c"></lightning-output-field>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-output-field field-name="Price__c"></lightning-output-field>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-output-field field-name="AvailableQuantity__c"></lightning-output-field>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1">
                                            <lightning-output-field field-name="Description__c"></lightning-output-field>
                                        </div>
                                    </div>
                                </lightning-record-view-form>
                            </div>
                        </div>
                    </div>

                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={handleClose}>Close</button>
                        <lightning-button
                            variant="brand"
                            label="Add to Cart"
                            onclick={handleAdd}
                            disabled={isOutOfStock}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </div>
    </template>
</template>
